server:
  port: 8086

spring:
  application:
    name: eventrio-ticketing-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/EventrioOfficial}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

resend:
  api-key: ${RESEND_API_KEY:}
  from: Eventrio <onboarding@resend.dev>

management:
  health:
    mongo:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
